<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="listings">
<header>
  <div class="container nav">
    <a class="brand" href="index.html">DriveHive</a>
    <nav class="nav-links">
      <a data-page="home" href="dashboard.html">Dashboard</a>
      <a data-page="listings" href="listings.html">Listings</a>
      <a data-page="about" href="about.html">About</a>
      <a data-page="contact" href="contact.html">Contact</a>
      <a data-page="blog" href="blog.html">Blog</a>
      <a data-page="support" href="support.html">Support</a>
      <a data-page="login" href="login.html">Login</a>
    </nav>
  </div>
</header>
<main class="container">
<h1>Book Your Vehicle</h1>
<form id="bookingForm" class="card">
  <label>Vehicle</label>
  <div id="selectedVehicle" class="notice"></div>
  <input id="selectedVehicleId" name="vehicle" type="hidden" required />
  <label>Pickup Location</label>
  <div class="autocomplete-container">
    <input id="pickupLocation" name="pickupLocation" autocomplete="off" required />
    <div id="pickupSuggestions" class="autocomplete-suggestions"></div>
  </div>
  <label>Dropoff Location</label>
  <div class="autocomplete-container">
    <input id="dropoffLocation" name="dropoffLocation" autocomplete="off" required />
    <div id="dropoffSuggestions" class="autocomplete-suggestions"></div>
  </div>
  <label>Pickup Date</label><input id="pickupDateTime" name="pickupDate" type="datetime-local" required />
  <label>Dropoff Date</label><input id="dropoffDateTime" name="dropoffDate" type="datetime-local" required />
  <label>Enter Your Driving License</label><input id="license" name="drivingLicense" type="text" placeholder="e.g. DL-0120110062821" required maxlength="18" />
  <button type="submit">Check Availability</button>
  <button id="confirmBookingBtn" type="button" disabled>Confirm Booking</button>
  <div id="bookingNotice"></div>
</form>
</main>
<footer class="footer">
  <div class="container">DriveHive - Secure bookings, flexible plans, 24/7 support.</div>
</footer>
<script src="assets/js/app.js"></script>
</body>
</html>
