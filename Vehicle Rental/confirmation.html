<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Confirmation</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="listings">
<header>
  <div class="container nav">
    <a class="brand" href="index.html">DriveHive</a>
    <nav class="nav-links">
      <a data-page="home" href="dashboard.html">Dashboard</a>
      <a data-page="listings" href="listings.html">Listings</a>
      <a data-page="about" href="about.html">About</a>
      <a data-page="contact" href="contact.html">Contact</a>
      <a data-page="blog" href="blog.html">Blog</a>
      <a data-page="support" href="support.html">Support</a>
      <a data-page="login" href="login.html">Login</a>
    </nav>
  </div>
</header>
<main class="container">
  <div id="confirmationCard" class="card"></div>
</main>
<footer class="footer">
  <div class="container">DriveHive - Secure bookings, flexible plans, 24/7 support.</div>
</footer>
<script>
  async function renderConfirmation() {
    const params = new URLSearchParams(window.location.search);
    const bookingId = params.get("bookingId");
    const card = document.getElementById("confirmationCard");

    try {
      const [bookingResponse, vehiclesResponse] = await Promise.all([
        fetch(`http://localhost:5000/api/bookings/${encodeURIComponent(bookingId || "")}`, { cache: "no-store" }),
        fetch("http://localhost:5000/api/vehicles", { cache: "no-store" })
      ]);
      if (!bookingResponse.ok) throw new Error("Booking not found");
      const booking = await bookingResponse.json();
      const vehicles = vehiclesResponse.ok ? await vehiclesResponse.json() : [];
      const vehicleNameMap = new Map(vehicles.map((v) => [String(v.id), v.name]));
      const total = Number(booking?.total || 0);
      const amount = total > 0 ? `₹${total.toLocaleString("en-IN")}` : "N/A";
      const pickupAddress = booking.pickupLocation && typeof booking.pickupLocation === 'object'
        ? booking.pickupLocation.address
        : (booking.pickupLocation || 'N/A');
      const dropoffAddress = booking.dropoffLocation && typeof booking.dropoffLocation === 'object'
        ? booking.dropoffLocation.address
        : (booking.dropoffLocation || 'N/A');

      card.innerHTML = `
        <h2>Booking Confirmed ✅</h2>
        <p>Booking ID: ${booking.id}</p>
        <p>Vehicle: ${vehicleNameMap.get(String(booking.vehicleId)) || booking.vehicleId}</p>
        <p>Pickup Date: ${booking.pickup}</p>
        <p>Pickup Location: ${pickupAddress}</p>
        <p>Dropoff Date: ${booking.dropoff}</p>
        <p>Dropoff Location: ${dropoffAddress}</p>
        <p>Total Paid: ${amount}</p>
        <p>Status: Confirmed</p>
      `;
    } catch (_err) {
      card.innerHTML = "<h2>Booking not found</h2><p>Please return to listings and book again.</p>";
    }
  }

  renderConfirmation();
</script>
</body>
</html>
