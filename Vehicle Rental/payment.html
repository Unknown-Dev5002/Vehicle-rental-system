<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="listings">
<header>
  <div class="container nav">
    <a class="brand" href="index.html">DriveHive</a>
    <nav class="nav-links">
      <a data-page="home" href="dashboard.html">Dashboard</a>
      <a data-page="listings" href="listings.html">Listings</a>
      <a data-page="about" href="about.html">About</a>
      <a data-page="contact" href="contact.html">Contact</a>
      <a data-page="blog" href="blog.html">Blog</a>
      <a data-page="support" href="support.html">Support</a>
      <a data-page="login" href="login.html">Login</a>
    </nav>
  </div>
</header>
<main class="container">
<h1>Payment & Confirmation</h1>
<div id="paymentSummary" class="card"></div>
<form id="paymentForm" class="card">
  <label>Payment Gateway</label>
  <select id="gateway" name="gateway"><option value="stripe">Stripe</option><option value="paypal">PayPal</option><option value="razorpay">Razorpay</option></select>
  <label>Cardholder Name</label><input id="cardName" required />
  <label>Card Number</label><input id="cardNumber" required />
  <label>Promo Code</label><input placeholder="WEEKEND20" />
  <button type="submit">Pay Securely</button>
  <div id="paymentNotice"></div>
</form>
<div id="paymentReceipt"></div>
</main>
<footer class="footer">
  <div class="container">DriveHive - Secure bookings, flexible plans, 24/7 support.</div>
</footer>
<script src="assets/js/app.js"></script>
</body>
</html>
